[workspace]
members = [".", "hamego-core", "hamego-wasm"]
resolver = "2"

[package]
name = "hamego"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
hamego-core = { path = "hamego-core", features = ["async"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
embedded-io-async = "0.6"
