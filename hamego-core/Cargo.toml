[package]
name = "hamego-core"
version = "0.1.0"
edition = "2024"

[dependencies]
embedded-io-async = { version = "0.6", optional = true }

[features]
default = []
async = ["embedded-io-async"]

[dev-dependencies]
embedded-io-async = "0.6"
embassy-sync = { version = "0.6" }
embassy-futures = { version = "0.1" }
critical-section = { version = "1", features = ["std"] }
